# Site configuration. The design (layouts/, assets/) is custom and lives in this repository:
# there is no external theme or Hugo module.

title: "John Mohd Wani"
baseURL: "https://johniitr.github.io/"
languageCode: en-us
defaultContentLanguage: en
removePathAccents: true

enableRobotsTXT: true
enableGitInfo: false
summaryLength: 30
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]

# Items per list page (Publications, Blog, tags). Kept high so each list stays on one page.
pagination:
  pagerSize: 50

taxonomies:
  tag: tags
  author: authors
  publication_type: publication_types

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true          # posts contain a few raw <figure> blocks
    parser:
      attribute:
        block: true
  highlight:
    codeFences: true        # code blocks go through layouts/_markup/render-codeblock.html (plain, styled by main.css)

imaging:
  resampleFilter: lanczos
  quality: 82
  anchor: smart

sitemap:
  changeFreq: monthly
