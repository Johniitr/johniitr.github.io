# Pagefind search index settings, read by `pagefind --site public` (npm run build and the deploy workflow).
# Only the main content of pages is indexed: the templates mark it with data-pagefind-body (papers, posts,
# talks, the homepage and the Research/Trainings/Experience pages). List pages, tag pages and the 404 page
# carry no marker, so they are not indexed. Repeated blocks inside a page are marked data-pagefind-ignore.
exclude_selectors:
  - ".acts"               # DOI / Cite / PDF buttons
  - ".masthead__actions"  # header buttons
